#Application related properties
spring.application.name=DTOPractice
server.port=8090

#Database related properties
#spring.datasource.url=jdbc:postgresql://localhost:5400/clnotesdb
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/clnotesdb
spring.datasource.url=${SPRING_DATASOURCE_URL: jdbc:postgresql://db:5400/clnotesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME: postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD: 1234}
spring.datasource.driverClassName=org.postgresql.Driver

#JPA related properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

